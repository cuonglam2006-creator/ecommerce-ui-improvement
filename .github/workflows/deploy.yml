name: Deploy Ecommerce Practice

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Bai 1 and Bai 3 websites
        run: |
          mkdir -p public/Bai1_Ecommerce
          cp -R BaiThucHanh_Responsive_JQuery/Bai1_Ecommerce/. public/Bai1_Ecommerce/

          mkdir -p public/Bai3_FlappyBird
          cp -R "BaiThucHanh_Responsive_JQuery/Bai3_FlappyBird/." public/Bai3_FlappyBird/

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
