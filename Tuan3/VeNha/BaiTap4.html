
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập CSS - Câu 4</title>

    <style>
        /* Câu 4 */
        ul {
            list-style: none;
            padding: 0;
            margin: 30px 0;
            text-align: center;
        }

        ul li {
            display: inline-block;
            width: 85px;
            background-color: #00e5ee;
            margin-right: 4px;
        }

        ul li a {
            display: block;
            color: blue;
            font-size: 20px;
            text-align: center;
            padding: 4px 0;
        }
    </style>
</head>

<body>

    <ul>
        <li><a href="#">TMDT</a></li>
        <li><a href="#">ERP</a></li>
        <li><a href="#">MIS</a></li>
        <li><a href="#">DS</a></li>
    </ul>

</body>
</html>
