<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cải tiến Popup Tìm Kiếm Thông Minh - TMĐT</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header-container">
        <!-- Logo website -->
        <div class="logo">
            <h2>BookStore.vn</h2>
        </div>

        <!-- Khu vực tìm kiếm cải tiến -->
        <div class="search-wrapper">
            <div class="search-box">
                <input type="text" placeholder="Tìm kiếm tựa sách, tác giả hoặc danh mục..." autocomplete="off">
                <button class="search-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>

            <!-- Popup gợi ý chia cột hiện đại (Cải tiến so với bản gốc bị rối mắt) -->
            <div class="search-popup-dropdown">
                <!-- Cột trái: Từ khóa hot dạng thẻ tag -->
                <div class="popup-column left-col">
                    <div class="section-title">
                        <span class="icon">🔥</span> Từ khóa xu hướng
                    </div>
                    <div class="tags-container">
                        <span class="search-tag">Claude Toàn Tập</span>
                        <span class="search-tag">Sách Kinh Tế</span>
                        <span class="search-tag">Jim Collins</span>
                        <span class="search-tag">Takenote Toán 8</span>
                        <span class="search-tag">Đắc Nhân Tâm</span>
                        <span class="search-tag">Sách Kỹ Năng</span>
                    </div>
                </div>

                <!-- Cột phải: Danh mục nổi bật có hình ảnh minh họa -->
                <div class="popup-column right-col">
                    <div class="section-title">
                        <span class="icon">📚</span> Danh mục nổi bật
                    </div>
                    <div class="category-grid-popup">
                        <div class="cat-item">
                            <div class="cat-img-box">📖</div>
                            <span>Kinh Tế Học</span>
                        </div>
                        <div class="cat-item">
                            <div class="cat-img-box">💡</div>
                            <span>Kỹ Năng Sống</span>
                        </div>
                        <div class="cat-item">
                            <div class="cat-img-box">🤖</div>
                            <span>AI & Công Nghệ</span>
                        </div>
                        <div class="cat-item">
                            <div class="cat-img-box">🎨</div>
                            <span>Văn Học - Tiểu Thuyết</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tiện ích bên phải -->
        <div class="header-right">
            <div class="cart-icon">🛒 Giỏ hàng (1)</div>
        </div>
    </div>
</body>
</html>
